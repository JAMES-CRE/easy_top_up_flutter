name: easy_top_up
description: Fuel & EV station finder in Ghana

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.9.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.0
  permission_handler: ^12.0.1   # for location permission
  google_fonts: ^8.0.2
  image_picker: ^1.1.2
  flutter_svg: ^2.0.9
  http: ^1.3.0
  shared_preferences: ^2.5.3
  flutter_polyline_points: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
